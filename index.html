<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfólio | Matheus</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* FUNDO */
body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(-45deg, #1e3c72, #2a5298, #000428, #004e92);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  color: white;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* HEADER */
header {
  text-align: center;
  padding: 70px 20px 40px;
}

/* TEXTO DIGITANDO */
.typing {
  font-size: 20px;
  margin-top: 10px;
  opacity: 0.85;
  min-height: 24px;
}

/* FOTO */
.profile {
  margin-top: 30px;
}

.profile img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 4px solid #00f2ff;
  object-fit: cover;
  animation: glow 2.5s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 15px #00f2ff; }
  to { box-shadow: 0 0 40px #8a2be2; }
}

/* LINKS */
.links {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-top: 20px;
}

.links a {
  padding: 10px 18px;
  border-radius: 25px;
  background: linear-gradient(90deg, #00f2ff, #8a2be2);
  color: white;
  text-decoration: none;
  font-weight: bold;
}

/* PLAYER */
.player {
  margin: 30px auto 0;
  max-width: 320px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  border-radius: 18px;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.player img {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  object-fit: cover;
}

.player-info {
  flex: 1;
}

.player-info p {
  font-size: 14px;
  opacity: 0.85;
}

.controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.controls button {
  border: none;
  background: linear-gradient(90deg, #00f2ff, #8a2be2);
  color: white;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 18px;
  cursor: pointer;
}

/* BARRA */
.progress {
  width: 100%;
  margin-top: 8px;
}

.progress input {
  width: 100%;
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* CARDS */
.card {
  background: rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 25px;
  backdrop-filter: blur(10px);
  transition: transform 0.4s;
}

.card:hover {
  transform: rotateY(8deg) rotateX(4deg) scale(1.03);
}

.card h2 {
  color: #00f2ff;
  margin-bottom: 10px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  font-size: 14px;
  opacity: 0.6;
}
</style>
</head>

<body>

<header>
  <h1>Matheus 😎</h1>
  <div class="typing" id="typing"></div>

  <div class="profile">
    <img src="https://i.imgur.com/vWoLx1T.png">
  </div>

  <div class="links">
    <a href="https://discord.gg/9scAtcXT" target="_blank">Discord</a>
    <a href="https://www.instagram.com/rlk_mtzin016/" target="_blank">Instagram</a>
  </div>

  <!-- PLAYER -->
  <div class="player">
    <img src="https://i.imgur.com/vWoLx1T.png">
    <div class="player-info">
      <strong>Minha música 🎵</strong>
      <p>Vibe do site</p>
      <div class="progress">
        <input type="range" id="progress" value="0">
      </div>
    </div>
    <div class="controls">
      <button onclick="toggleMusic()">▶</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="card">
    <h2>👋 Sobre mim</h2>
    <p>Começando do zero e já dominando o básico 😈</p>
  </div>

  <div class="card">
    <h2>🧠 Aprendendo</h2>
    <p>HTML • CSS • GitHub Pages</p>
  </div>

  <div class="card">
    <h2>🚀 Objetivo</h2>
    <p>Virar dev e criar projetos cada vez mais insanos.</p>
  </div>
</div>

<footer>
  © 2026 • Matheus
</footer>

<audio id="bgMusic">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// TEXTO DIGITANDO
const text = "Começando do zero • Criando sites • Evoluindo 🚀";
let i = 0;
function typingEffect() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typingEffect, 70);
  }
}
typingEffect();

// MÚSICA
const music = document.getElementById("bgMusic");
const progress = document.getElementById("progress");

function toggleMusic() {
  music.paused ? music.play() : music.pause();
}

music.addEventListener("timeupdate", () => {
  progress.value = (music.currentTime / music.duration) * 100;
});

progress.addEventListener("input", () => {
  music.currentTime = (progress.value / 100) * music.duration;
});
</script>

</body>
</html>
