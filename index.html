<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site do | Matheus</title>

<!-- FAVICON -->
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" href="favicon.png">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(-45deg, #1e3c72, #2a5298, #000428, #004e92);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  color: white;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* HEADER */
header {
  text-align: center;
  padding: 70px 20px 30px;
}

.typing {
  font-size: 20px;
  margin-top: 10px;
  opacity: 0.85;
  min-height: 24px;
}

.profile {
  margin-top: 30px;
}

.profile img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 4px solid #00f2ff;
  object-fit: cover;
  animation: glow 2.5s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 15px #00f2ff; }
  to { box-shadow: 0 0 40px #8a2be2; }
}

.links {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-top: 20px;
}

.links a {
  padding: 10px 18px;
  border-radius: 25px;
  background: linear-gradient(90deg, #00f2ff, #8a2be2);
  color: white;
  text-decoration: none;
  font-weight: bold;
}

/* PLAYER */
.player {
  margin: 30px auto;
  max-width: 340px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  border-radius: 18px;
  padding: 15px;
  text-align: center;
}

.player img {
  width: 100%;
  border-radius: 14px;
}

.player h3 {
  margin: 10px 0;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 20px;
  font-size: 26px;
  cursor: pointer;
}

.progress {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.3);
  border-radius: 5px;
  margin: 10px 0;
  cursor: pointer;
}

.progress div {
  height: 100%;
  width: 0%;
  background: #00f2ff;
  border-radius: 5px;
}

.time {
  font-size: 12px;
  opacity: 0.8;
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 25px;
  backdrop-filter: blur(10px);
}

.card h2 {
  color: #00f2ff;
  margin-bottom: 10px;
}

/* SKILLS */
.skill {
  margin: 10px 0;
}

.bar {
  height: 10px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
}

.bar span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #00f2ff, #8a2be2);
  border-radius: 10px;
  animation: fill 2s forwards;
}

@keyframes fill {
  to { width: var(--level); }
}

/* BOTÕES */
.actions {
  text-align: center;
  margin-top: 20px;
}

.actions button {
  padding: 10px 18px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  background: linear-gradient(90deg, #00f2ff, #8a2be2);
  color: white;
  font-weight: bold;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  font-size: 14px;
  opacity: 0.6;
}
</style>
</head>

<body>

<header>
  <h1>Matheus 😎</h1>
  <div class="typing" id="typing"></div>

  <div class="profile">
    <img src="https://i.imgur.com/vWoLx1T.png">
  </div>

  <div class="links">
    <a href="https://discord.gg/9scAtcXT" target="_blank">Discord</a>
    <a href="https://www.instagram.com/rlk_mtzin016/" target="_blank">Instagram</a>
  </div>

  <div class="player">
    <img src="https://imgur.com/ZAcuhSz.png">
    <h3>Gargalhada do meu AK 🔫</h3>

    <div class="controls">
      <span onclick="togglePlay()">▶️</span>
    </div>

    <div class="progress" onclick="setProgress(event)">
      <div id="progress"></div>
    </div>

    <div class="time">
      <span id="current">0:00</span> /
      <span id="duration">0:00</span>
    </div>
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>💻 Projetos</h2>
    <p>• Ganhar muito dinheiro</p>
  </div>

  <div class="card">
    <h2>🧠 Cerebro ta ruim</h2>

    <div class="skill">HTML
      <div class="bar"><span style="--level:70%"></span></div>
    </div>

    <div class="skill">CSS
      <div class="bar"><span style="--level:60%"></span></div>
    </div>

    <div class="skill">GitHub
      <div class="bar"><span style="--level:50%"></span></div>
    </div>
  </div>

  <div class="actions">
    <button onclick="copyLink()">📋 Copiar link do site</button>
  </div>

</div>

<footer>
  © 2026 • Matheus • <span id="clock"></span>
</footer>

<audio id="audio">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const text = "Começando do zero • So quero dinheiro • Criando site inútil 🚀";
let i = 0;
function typingEffect() {
  if (i < text.length) {
    typing.innerHTML += text.charAt(i);
    i++;
    setTimeout(typingEffect, 60);
  }
}
typingEffect();

const audio = document.getElementById("audio");
const progress = document.getElementById("progress");

function togglePlay() {
  audio.paused ? audio.play() : audio.pause();
}

audio.addEventListener("timeupdate", () => {
  progress.style.width = (audio.currentTime / audio.duration) * 100 + "%";
  current.innerText = format(audio.currentTime);
  duration.innerText = format(audio.duration);
});

function setProgress(e) {
  const percent = e.offsetX / e.target.clientWidth;
  audio.currentTime = percent * audio.duration;
}

function format(sec) {
  if (!sec) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("Link copiado 😎");
}

setInterval(() => {
  clock.innerText = new Date().toLocaleTimeString();
}, 1000);
</script>

</body>
</html>
