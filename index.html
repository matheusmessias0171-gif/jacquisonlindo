<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site do | Matheus</title>

<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" href="favicon.png">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: radial-gradient(circle at top, #1b2735, #090a0f);
  color: white;
  overflow-x: hidden;
}

/* PARTÍCULAS */
canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
}

/* HEADER */
header {
  text-align: center;
  padding: 70px 20px 40px;
}

h1 {
  font-size: 42px;
}

.typing {
  font-size: 20px;
  opacity: .85;
  margin-top: 8px;
}

.status {
  margin-top: 10px;
  font-size: 14px;
  color: #00ff88;
}

/* FOTO */
.profile img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  margin-top: 25px;
  border: 4px solid #00f2ff;
  animation: pulse 3s infinite alternate;
}

@keyframes pulse {
  from { box-shadow: 0 0 15px #00f2ff; }
  to { box-shadow: 0 0 35px #8a2be2; }
}

/* LINKS */
.links {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
}

.links a {
  padding: 10px 18px;
  border-radius: 25px;
  background: linear-gradient(90deg,#00f2ff,#8a2be2);
  color: white;
  text-decoration: none;
  font-weight: bold;
}

/* PLAYER */
.player {
  margin: 35px auto;
  max-width: 340px;
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 15px;
}

.player img {
  width: 100%;
  border-radius: 12px;
}

.controls {
  font-size: 28px;
  cursor: pointer;
  margin-top: 8px;
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 25px;
  margin-bottom: 25px;
  transition: transform .4s;
}

.card:hover {
  transform: translateY(-6px) scale(1.02);
}

.card h2 {
  color: #00f2ff;
  margin-bottom: 10px;
}

/* NUMERO 9 */
.big-nine {
  font-size: 90px;
  font-weight: bold;
  text-align: center;
  background: linear-gradient(90deg,#00f2ff,#8a2be2);
  -webkit-background-clip: text;
  color: transparent;
  animation: glowNine 1.5s infinite alternate;
}

@keyframes glowNine {
  from { filter: drop-shadow(0 0 10px #00f2ff); }
  to { filter: drop-shadow(0 0 25px #8a2be2); }
}

/* FOOTER */
footer {
  text-align: center;
  opacity: .6;
  padding: 20px;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<header>
  <h1>Matheus 😎</h1>
  <div class="typing" id="typing"></div>
  <div class="status">🟢 Online agora</div>

  <div class="profile">
    <img src="https://i.imgur.com/vWoLx1T.png">
  </div>

  <div class="links">
    <a href="#">Discord</a>
    <a href="#">Instagram</a>
  </div>

  <div class="player">
    <img src="https://imgur.com/ZAcuhSz.png">
    <h3>Gargalhada do meu AK 🔫</h3>
    <div class="controls" onclick="togglePlay()">▶️</div>
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>🔢 Número lendário</h2>
    <div class="big-nine">9</div>
  </div>

  <div class="card">
    <h2>💻 Projetos</h2>
    <p>• Ganhar muito dinheiro</p>
  </div>

  <div class="card">
    <h2>👀 Visitas</h2>
    <p id="visits"></p>
  </div>

</div>

<footer>
  © 2026 • Matheus • <span id="clock"></span>
</footer>

<audio id="audio">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// TEXTO DIGITANDO
const text = "Começando do zero • Só quero dinheiro • Site insano 😈";
let i = 0;
(function type(){
  if(i < text.length){
    typing.innerHTML += text[i++];
    setTimeout(type, 55);
  }
})();

// PLAYER
const audio = document.getElementById("audio");
function togglePlay(){
  audio.paused ? audio.play() : audio.pause();
}

// RELÓGIO
setInterval(()=>{
  clock.innerText = new Date().toLocaleTimeString();
},1000);

// VISITAS (fake local)
let visits = localStorage.getItem("visits") || 0;
visits++;
localStorage.setItem("visits", visits);
document.getElementById("visits").innerText = `👁️ ${visits} visitas`;

// EASTER EGG
let secret = "";
document.addEventListener("keydown", e => {
  secret += e.key.toLowerCase();
  if(secret.includes("ak47")){
    alert("🔫 Easter Egg desbloqueado 😈");
    secret = "";
  }
});

// PARTÍCULAS
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
resize();
window.onresize = resize;

let stars = Array.from({length:80}, () => ({
  x: Math.random()*canvas.width,
  y: Math.random()*canvas.height,
  r: Math.random()*1.5+0.5,
  s: Math.random()*0.5+0.2
}));

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#00f2ff";
  stars.forEach(p=>{
    p.y += p.s;
    if(p.y > canvas.height) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
