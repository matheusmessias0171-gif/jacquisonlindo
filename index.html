<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Portfólio | Matheus</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* FUNDO */
body {
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0f0f1a, #050510);
  color: white;
  overflow-x: hidden;
}

/* CANVAS ESTRELAS */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

/* ANIMAÇÃO */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* HEADER */
header {
  text-align: center;
  padding: 80px 20px 40px;
  animation: fadeUp 1s ease;
}

header h1 {
  font-size: 44px;
}

header p {
  margin-top: 10px;
  opacity: 0.8;
}

/* FOTO */
.profile {
  margin-top: 30px;
}

.profile img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 4px solid #00f2ff;
  box-shadow: 0 0 25px #00f2ff;
  object-fit: cover;
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* CARDS */
.card {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  animation: fadeUp 1.2s ease;
  transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
  transform: translateY(-10px);
  box-shadow: 0 0 40px rgba(0, 242, 255, 0.6);
}

.card h2 {
  margin-bottom: 10px;
  color: #00f2ff;
}

/* BOTÃO MÚSICA */
.music {
  position: fixed;
  bottom: 20px;
  right: 20px;
}

.music button {
  background: linear-gradient(90deg, #00f2ff, #8a2be2);
  border: none;
  padding: 12px 20px;
  border-radius: 30px;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 25px;
  font-size: 14px;
  opacity: 0.6;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<header>
  <h1>Matheus 😎</h1>
  <p>Começando do zero • Aprendendo programação</p>

  <div class="profile">
    <!-- TROQUE O LINK DA IMAGEM PELA SUA -->
    <img src="https://imgur.com/vWoLx1T" alt="Minha foto">
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>👋 Sobre mim</h2>
    <p>
      Sou lindo e cheiroso 🚀
    </p>
  </div>

  <div class="card">
    <h2>🧠 O que estou aprendendo</h2>
    <p>• HTML</p>
    <p>• CSS</p>
    <p>• Como sites funcionam</p>
  </div>

  <div class="card">
    <h2>🚀 Objetivo</h2>
    <p>
      Evoluir cada vez mais e criar projetos melhores.
    </p>
  </div>

</div>

<footer>
  © 2026 • Feito por Matheus no VS Code 💻
</footer>

<!-- BOTÃO MÚSICA -->
<div class="music">
  <button onclick="toggleMusic()">🎵 Música</button>
</div>

<audio id="bgMusic" loop>
  <!-- TROQUE O LINK DA MÚSICA SE QUISER -->
  <source src="https://www.youtube.com/watch?v=9vfDcFj3UKE">
</audio>

<script>
// CONTROLE DA MÚSICA
const music = document.getElementById("bgMusic");
function toggleMusic() {
  if (music.paused) {
    music.play();
  } else {
    music.pause();
  }
}

// ESTRELAS
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = Array.from({ length: 150 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 2,
  d: Math.random() * 1
}));

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    s.y += s.d;
    if (s.y > canvas.height) s.y = 0;
  });

  requestAnimationFrame(drawStars);
}

drawStars();
</script>

</body>
</html>
