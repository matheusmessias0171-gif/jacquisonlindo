<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfólio | Matheus</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* FUNDO */
body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(-45deg, #1e3c72, #2a5298, #000428, #004e92);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  color: white;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* HEADER */
header {
  text-align: center;
  padding: 70px 20px 40px;
}

/* TEXTO DIGITANDO */
.typing {
  font-size: 20px;
  margin-top: 10px;
  opacity: 0.85;
  min-height: 24px;
}

/* FOTO */
.profile {
  margin-top: 30px;
}

.profile img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 4px solid #00f2ff;
  object-fit: cover;
  animation: glow 2.5s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 15px #00f2ff; }
  to { box-shadow: 0 0 40px #8a2be2; }
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* CARDS */
.card {
  background: rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 25px;
  backdrop-filter: blur(10px);
  transition: transform 0.4s;
}

.card:hover {
  transform: rotateY(8deg) rotateX(4deg) scale(1.03);
}

.card h2 {
  color: #00f2ff;
  margin-bottom: 10px;
}

/* LINKS */
.links {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-top: 20px;
}

.links a {
  padding: 10px 18px;
  border-radius: 25px;
  background: linear-gradient(90deg, #00f2ff, #8a2be2);
  color: white;
  text-decoration: none;
  font-weight: bold;
}

/* BOTÃO MÚSICA */
.music {
  position: fixed;
  bottom: 20px;
  right: 20px;
}

.music button {
  padding: 12px 20px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  background: linear-gradient(90deg, #00f2ff, #8a2be2);
  color: white;
  font-weight: bold;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  font-size: 14px;
  opacity: 0.6;
}

/* MOBILE */
@media (max-width: 600px) {
  header h1 { font-size: 32px; }
  .profile img { width: 120px; height: 120px; }
}
</style>
</head>

<body>

<header>
  <h1>Matheus 😎</h1>
  <div class="typing" id="typing"></div>

  <div class="profile">
    <img src="https://i.imgur.com/vWoLx1T.png">
  </div>

  <div class="links">
    <a href="https://discord.gg/9scAtcXT" target="_blank">Discord</a>
    <a href="https://www.instagram.com/rlk_mtzin016/" target="_blank">Instagram</a>
  </div>
</header>

<div class="container">
  <div class="card">
    <h2>👋 Sobre mim</h2>
    <p>Começando do zero e já dominando o básico 😈</p>
  </div>

  <div class="card">
    <h2>🧠 Aprendendo</h2>
    <p>HTML • CSS • GitHub Pages</p>
  </div>

  <div class="card">
    <h2>🚀 Objetivo</h2>
    <p>Virar dev e criar projetos cada vez mais insanos.</p>
  </div>
</div>

<footer>
  © 2026 • Matheus
</footer>

<div class="music">
  <button onclick="toggleMusic()">🎵 Música</button>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// TEXTO DIGITANDO
const text = "Começando do zero • Criando sites • Evoluindo 🚀";
let i = 0;
const speed = 70;
function typingEffect() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typingEffect, speed);
  }
}
typingEffect();

// MÚSICA
const music = document.getElementById("bgMusic");
function toggleMusic() {
  music.paused ? music.play() : music.pause();
}
</script>

</body>
</html>
