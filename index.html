<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site do | Matheus</title>

<link rel="icon" href="favicon.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family: Arial, sans-serif;
  min-height:100vh;
  color:#fff;
  overflow-x:hidden;

  background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.85)),
    url("https://imgur.com/PpQ8dWg.gif");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}


/* FUNDO PARTÍCULAS */
canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* HEADER */
header{
  text-align:center;
  padding:70px 20px 40px;
}

h1{font-size:42px}

.typing{
  margin-top:8px;
  font-size:18px;
  opacity:.85;
}

.status{
  margin-top:6px;
  font-size:14px;
  color:#00ff88;
}

/* FOTO */
.profile img{
  width:150px;
  height:150px;
  border-radius:50%;
  margin-top:25px;
  border:4px solid #0ae441;
  box-shadow:0 0 25px #ffffff;
}

/* BADGES */
.badges{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:20px;
  flex-wrap:wrap;
}

.badge{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  border-radius:16px;
  padding:14px;
  width:110px;
  transition:.3s;
}

.badge:hover{
  transform:translateY(-6px) scale(1.05);
  box-shadow:0 0 20px #8a2be2;
}

.badge img{
  width:60px;
  display:block;
  margin:auto;
}

.badge span{
  display:block;
  margin-top:8px;
  font-size:13px;
  opacity:.9;
}

/* LINKS */
.links{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:25px;
}

.links a{
  padding:10px 20px;
  border-radius:25px;
  background:linear-gradient(90deg,#00f2ff,#8a2be2);
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

/* PLAYER */
.player{
  margin:35px auto;
  max-width:320px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:15px;
}

.player img{
  width:100%;
  border-radius:12px;
}

.controls{
  margin-top:10px;
  font-size:28px;
  cursor:pointer;
}

.volume{
  width:100%;
  margin-top:8px;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,.08);
  border-radius:18px;
  padding:25px;
  margin-bottom:25px;
  transition:.4s;
}

.card:hover{
  transform:translateY(-6px);
}

.card h2{
  color:#00f2ff;
  margin-bottom:10px;
}

/* NUMERO */
.big-number{
  font-size:80px;
  font-weight:bold;
  text-align:center;
  background:linear-gradient(90deg,#00f2ff,#8a2be2);
  -webkit-background-clip:text;
  color:transparent;
}

/* FOOTER */
footer{
  text-align:center;
  opacity:.6;
  padding:20px;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<header>
  <h1>Matheus 😎</h1>
  <div class="typing" id="typing"></div>
  <div class="status">🟢 Online agora</div>

  <div class="profile">
    <img src="https://i.imgur.com/vWoLx1T.png">
  </div>

  <!-- BADGES -->
  <div class="badges">
    <div class="badge">
      <img src="badges/dev.png">
      <span>Developer</span>
    </div>
    <div class="badge">
      <img src="badges/python.png">
      <span>Python</span>
    </div>
    <div class="badge">
      <img src="badges/owner.png">
      <span>Founder</span>
    </div>
  </div>

  <div class="links">
    <a href="https://discord.gg/Pz5VaveX" target="_blank">Discord</a>
    <a href="https://www.instagram.com/rlk_mtzin016/" target="_blank">Instagram</a>
  </div>

  <!-- PLAYER -->
  <div class="player">
    <img src="https://imgur.com/ZAcuhSz.png">
    <h3>Gargalhada do meu AK 🔫</h3>
    <div class="controls" onclick="togglePlay()">▶️</div>
    <input type="range" class="volume" min="0" max="1" step="0.01" onchange="audio.volume=this.value">
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>🍀 Número da sorte</h2>
    <div class="big-number">7</div>
  </div>

  <div class="card">
    <h2>💻 Projeto</h2>
    <p>Ganhar dinheiro 💸</p>
  </div>

</div>

<footer>
  © 2026 • Matheus
</footer>

<audio id="audio">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// TEXTO DIGITANDO
const text = "Começando do zero • Foco total •  DEV 🚀";
let i=0;
(function type(){
  if(i<text.length){
    typing.innerHTML+=text[i++];
    setTimeout(type,55);
  }
})();

// PLAYER
const audio=document.getElementById("audio");
function togglePlay(){
  audio.paused ? audio.play() : audio.pause();
}

let stars=Array.from({length:90},()=>({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  r:Math.random()*1.5+0.5,
  s:Math.random()*0.6+0.2
}));

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00f2ff";
  stars.forEach(p=>{
    p.y+=p.s;
    if(p.y>canvas.height)p.y=0;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
